# The Switzerland Builder's own Python, made by the launcher with micromamba (conda-forge) in builder/.runtime:
# nothing has to be installed on the PC beforehand. numpy, scipy, shapely and scikit-image are pinned to the minor
# versions the pipeline is built with on GitHub (zone_build.yml); rasterio and pyogrio solve together on one GDAL
# (exact pins of both did not solve, 2026-11-07); osmium-tool is the program download_osm.py runs for OpenStreetMap.
name: swissbuilder
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4
  - scipy=1.17
  - shapely=2.1
  - rasterio>=1.4
  - pyproj>=3.7
  - scikit-image=0.26
  - pillow>=12
  - requests>=2.32
  - matplotlib-base>=3.10
  - pyogrio>=0.10
  - pyosmium>=4
  - osmium-tool>=1.16
  - psutil
  - pip
  - pip:
      - opencv-python-headless==5.0.0.93
