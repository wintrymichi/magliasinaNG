# Floating roofs of v3.1: the development pack of roofs_pack.py (the buildings of swissBUILDINGS3D with roofs and no
# walls, the DTM/DSM under them, SWISSIMAGE 10 cm over them), committed to beamng/verifica/tetti/pack on the branch:
# the cloud session that writes the posts under them cannot reach swisstopo.
# stamp: 3
name: roofs pack

on:
  workflow_dispatch:
  push:
    branches: [claude/tetti-fluttuanti-8q4m1p]
    paths: [.github/workflows/roofs_pack.yml]

concurrency:
  group: roofs-pack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_OSM_PINNED: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            scikit-image==0.26.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 requests==2.33.1 \
            matplotlib==3.11.2 pyogrio==0.13.0

      - name: Downloads of the build runs
        uses: actions/cache@v4
        with:
          path: /home/runner/work/magliasinaNG/bm/data
          key: v3-data-${{ hashFiles('beamng/pipeline/download_*.py') }}
          restore-keys: v3-data-

      - name: Download (what the cache lacks)
        working-directory: beamng/pipeline
        run: |
          mkdir -p "$MAGLIASO_ROOT/work" "$MAGLIASO_ROOT/data"
          python prepare_work.py
          python download_swisstopo.py
          python download_worldcover.py
          python download_av.py
          python download_tlm.py
          python download_gwr.py

      - name: Rasters and buildings
        working-directory: beamng/pipeline
        run: |
          python build_rasters.py
          python extract_buildings.py

      - name: Pack
        working-directory: beamng/pipeline
        run: |
          rm -rf ../verifica/tetti/pack
          python roofs_pack.py ../verifica/tetti/pack
          git checkout -- ../dati || true
          du -sh ../verifica/tetti/pack/*

      - name: Commit the pack
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beamng/verifica/tetti/pack
          git commit -m "floating roofs: development pack (roofs without walls, ground, orthophoto)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 10; done
