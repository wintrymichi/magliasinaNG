# Test zip for the far trees (far_trees.py, PR #28): the full-area tree list (trees.py, every tree measured in
# the area) is computed here on a GitHub server from the same open data as the release workflows, then
# patch_far_trees.py puts the far trees into the published v2.6 zip. Both the zip and work/trees.npz are
# uploaded as artifacts of the run (nothing is published as a release).
name: Far trees test zip

on:
  workflow_dispatch:
  push:
    branches: [claude/distant-trees-lod-td8e45]
    paths: [.github/workflows/far_trees_test.yml]

jobs:
  far-trees:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      MAGLIASO_NO_PHOTO_TEXTURES: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            scikit-image==0.26.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 requests==2.33.1 \
            matplotlib==3.11.2 pyogrio==0.13.0

      - name: Download
        working-directory: beamng/pipeline
        run: |
          python prepare_work.py
          python download_swisstopo.py
          python download_av.py
          python download_tlm.py
          python download_gwr.py

      - name: Rasters, buildings, trees
        working-directory: beamng/pipeline
        run: |
          python build_rasters.py
          python landcover.py
          python extract_buildings.py
          python missing_buildings.py
          python trees.py

      - name: Far trees into the v2.6 zip
        working-directory: beamng/pipeline
        run: |
          mkdir -p "$MAGLIASO_ROOT/dist"
          gh release download v2.6 --pattern 'magliaso_pura_v2.6.zip' --dir "$MAGLIASO_ROOT/dist"
          python patch_far_trees.py "$MAGLIASO_ROOT/dist/magliaso_pura_v2.6.zip" "$MAGLIASO_ROOT/dist/magliaso_pura_v2.6_far_trees.zip"
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv "$MAGLIASO_ROOT/dist/magliaso_pura_v2.6_far_trees.zip" "$GITHUB_WORKSPACE/out/"
          cp "$MAGLIASO_ROOT/work/trees.npz" "$GITHUB_WORKSPACE/out/trees.npz"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: far-trees-test
          path: out/
          retention-days: 14
          compression-level: 0
