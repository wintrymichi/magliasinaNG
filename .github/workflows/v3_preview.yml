# Quick 3D previews of v3.0 changes, without the two-hour build: the smoothed survey curves (preview_smooth.py)
# over the whole map (overlaps and gaps between neighbours) and rendered at the curviest spots, before and after.
# The renders and numbers are committed to beamng/verifica/preview/ on the branch, so they can be looked at
# without downloading artifacts.
name: v3 preview

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-z0snz2]
    paths: [.github/workflows/v3_preview.yml, beamng/pipeline/preview_smooth.py, beamng/pipeline/smooth_geom.py]

concurrency:
  group: v3-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            pillow==12.3.0 requests==2.33.1 matplotlib==3.11.2

      - name: Downloads of the build runs
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/work/magliasinaNG/bm/data
          key: v3-data-${{ hashFiles('beamng/pipeline/download_*.py') }}
          restore-keys: v3-data-

      - name: Survey (when not cached)
        working-directory: beamng/pipeline
        run: python download_av.py

      - name: Render
        working-directory: beamng/pipeline
        run: |
          rm -rf ../verifica/preview
          python preview_smooth.py ../verifica/preview

      - name: Commit the renders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beamng/verifica/preview
          git commit -m "v3 preview: renders of $(git rev-parse --short HEAD)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
