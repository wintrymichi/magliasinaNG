# Publishes v3.0.40 (michi, 2026-10-20: "pubblicala in ogni caso"): the zip michi tested in the game, the nightly #2
# (built from afad5c1, the baked far-tree imposters added by nightly_patch.yml), renamed magliaso_pura_v3.0.40.zip,
# as the latest release v3.0.40 on main with the notes of beamng/RELEASE_v3.0.40.md. It checks the md5 of the zip
# first, so a newer nightly is never published by mistake.
# It runs when beamng/release/v3.0.40.txt changes on the integration branch, after the release PR is merged.
name: Release v3.0.40

on:
  workflow_dispatch:
  push:
    branches: [claude/chiazze-chiare-strada-eci3wc]
    paths: [beamng/release/v3.0.40.txt]

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TESTED_MD5: cb162c9552da74949a03fca2af7718dc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: The tested zip
        run: |
          mkdir -p "$RUNNER_TEMP/z"
          gh release download nightly --pattern "magliaso_pura_v3.0.40_nightly.zip" --dir "$RUNNER_TEMP/z"
          md5=$(md5sum "$RUNNER_TEMP/z/magliaso_pura_v3.0.40_nightly.zip" | cut -d' ' -f1)
          echo "md5 $md5"
          test "$md5" = "$TESTED_MD5"
          mv "$RUNNER_TEMP/z/magliaso_pura_v3.0.40_nightly.zip" "$RUNNER_TEMP/z/magliaso_pura_v3.0.40.zip"
          ls -l "$RUNNER_TEMP/z"

      - name: Publish
        run: |
          test -f beamng/RELEASE_v3.0.40.md
          gh release create v3.0.40 "$RUNNER_TEMP/z/magliaso_pura_v3.0.40.zip" --target main --latest \
            --title "BeamNG.drive map Malcantone v3.0.40" --notes-file beamng/RELEASE_v3.0.40.md
          gh release view v3.0.40 --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)")'
