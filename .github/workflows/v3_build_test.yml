# Build test of v3.0: the complete level built from scratch by build_level.py (every finishing step inside), then the
# automatic checks (check_level.py, drive_test.py), the package and the count of what the level has twice (doubles.py).
# Uploaded as artifacts of the run: "v3-build-test" (the zip to test in the game, the reports, the check results, the
# build log) and "v3-dev" (the intermediate rasters and tables the v3 work is developed and checked on outside
# Actions: trees, land cover, terrain heights and layers, orthophoto, WorldCover, the forest of the level). The
# downloads are cached between runs. Nothing is published as a release.
#
# It runs when this file changes on the v3 branch (bump the build stamp below to rebuild) or on demand.
# build stamp: 6
name: v3 build test

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-z0snz2]
    paths: [.github/workflows/v3_build_test.yml]

concurrency:
  group: v3-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      MAGLIASO_NO_PHOTO_TEXTURES: "1"
      MAGLIASO_REFERENCE_ZIP: ${{ github.workspace }}/../bm/dist/magliaso_pura_v1.1.zip
      MAGLIASO_OSM_PINNED: "1"
      PYTHONHASHSEED: "0"
      PATCH_WORKERS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            scikit-image==0.26.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 requests==2.33.1 \
            matplotlib==3.11.2 pyogrio==0.13.0

      - name: Downloads from earlier runs
        uses: actions/cache@v4
        with:
          path: /home/runner/work/magliasinaNG/bm/data     # MAGLIASO_ROOT/data, written out: the cache takes no '..'
          key: v3-data-${{ hashFiles('beamng/pipeline/download_*.py') }}
          restore-keys: v3-data-

      - name: Release v1.1 (objects of the original route, neutral textures)
        run: |
          mkdir -p "$MAGLIASO_ROOT/dist"
          gh release download v1.1 --pattern magliaso_pura_v1.1.zip --dir "$MAGLIASO_ROOT/dist"

      - name: Download
        working-directory: beamng/pipeline
        run: |
          python prepare_work.py
          python download_swisstopo.py
          python download_worldcover.py
          python download_av.py
          python download_tlm.py
          python download_gwr.py
          du -sh "$MAGLIASO_ROOT/data"/* || true

      - name: Rasters, buildings, trees
        working-directory: beamng/pipeline
        run: |
          python build_rasters.py
          python landcover.py
          python extract_buildings.py
          python missing_buildings.py
          python trees.py

      - name: Road network
        working-directory: beamng/pipeline
        run: |
          python network.py
          python network_surface.py

      - name: Level (build_level.py, every finishing step inside)
        working-directory: beamng/pipeline
        run: |
          python build_level.py | tee "$MAGLIASO_ROOT/build_level.log"
          df -h .

      - name: Checks
        working-directory: beamng/pipeline
        run: |
          O="$GITHUB_WORKSPACE/out"
          mkdir -p "$O"
          python check_level.py || true
          cp ../verifica/check_level.json "$O/check_level.json"
          python drive_test.py || true
          cp ../verifica/drive_test.json "$O/drive_test.json"
          git checkout -- ../verifica/check_level.json ../verifica/drive_test.json

      - name: Package
        working-directory: beamng/pipeline
        run: |
          O="$GITHUB_WORKSPACE/out"
          python package.py magliaso_pura_v3.0 | tee "$O/package.log"
          mv "$MAGLIASO_ROOT/dist/magliaso_pura_v3.0.zip" "$O/"
          cp -r "$MAGLIASO_ROOT/work/reports" "$O/reports" || true
          cp "$MAGLIASO_ROOT/build_level.log" "$O/"
          ls -la "$O"
          md5sum "$O/magliaso_pura_v3.0.zip"

      - name: What the level has twice (doubles.py)
        working-directory: beamng/pipeline
        run: |
          O="$GITHUB_WORKSPACE/out"
          python doubles.py "$O/magliaso_pura_v3.0.zip" "$O/doubles.json" || true

      - name: Development data
        run: |
          W="$MAGLIASO_ROOT/work"
          D="$GITHUB_WORKSPACE/dev"
          mkdir -p "$D"
          du -ah "$W" | sort -h | tail -60
          for f in trees.npz landcover05.npz terrain_heights.npy terrain_layers.npy ortho.tif terrain_colors.json \
                   av_local.pkl dtm2.npz; do
            cp -r "$W/$f" "$D/" 2>/dev/null || echo "missing $f"
          done
          cp "$MAGLIASO_ROOT/data/worldcover/worldcover.tif" "$D/" || true
          L="$MAGLIASO_ROOT/beamng_user/levels/magliaso_pura"
          tar -C "$L" --exclude='*.dae' -cf "$D/level_light.tar" forest art/forest art/terrains main || true
          ls -la "$D"

      - uses: actions/upload-artifact@v4
        with:
          name: v3-build-test
          path: out/
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: v3-dev
          path: dev/
          retention-days: 14
          compression-level: 1
