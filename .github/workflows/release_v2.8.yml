# Release v2.8 of the BeamNG map (Malcantone): the level built from scratch by build_level.py with the same open data
# as the earlier releases (swisstopo, the official survey, the building register, OpenStreetMap from the extract in
# beamng/dati, the numbers of the panoramas and the orthophoto kept in beamng/dati), with every step of v2.5 to v2.8
# inside the build (build_level.FINISH): optimize, grass, unpaved roads, markings, far trees, signs, paved edges,
# wall fill, understory, street lamps (lit at night), roadside, catenary, more signs, lake, house details; the guard
# rails are the models of the game's Italy level, the windows of the houses are lit at night.
# The same build, with the checks, is the "v2.8 build test" workflow (v28_build_test.yml), whose zip is the one
# tested in the game (beamng/verifica/v2.8/final_test_plan.md); the digest package.py prints is the same in both
# logs for the same commit. The release contains and downloads no Street View image.
# Started by hand, after the test in the game: Actions > Release v2.8 > Run workflow.
name: Release v2.8

on:
  workflow_dispatch:
    inputs:
      tested_digest:
        description: "The digest of the zip tested in the game (last line of the package step of the v2.8 build test); empty: no check"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      MAGLIASO_NO_PHOTO_TEXTURES: "1"
      MAGLIASO_REFERENCE_ZIP: ${{ github.workspace }}/../bm/dist/magliaso_pura_v1.1.zip
      MAGLIASO_OSM_PINNED: "1"
      PYTHONHASHSEED: "0"
      PATCH_WORKERS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Ready to release
        run: |
          if grep -q '<!-- draft' beamng/RELEASE_v2.8.md; then
            echo "::error::beamng/RELEASE_v2.8.md is still the draft: write the test in the game in it and remove the draft line (beamng/verifica/v2.8/final_test_plan.md)"
            exit 1
          fi
          if gh release view v2.8 > /dev/null 2>&1; then
            echo "::error::the release v2.8 exists already"
            exit 1
          fi

      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            scikit-image==0.26.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 requests==2.33.1 \
            matplotlib==3.11.2 pyogrio==0.13.0

      - name: Release v1.1 (objects of the original route, neutral textures)
        run: |
          mkdir -p "$MAGLIASO_ROOT/dist"
          gh release download v1.1 --pattern magliaso_pura_v1.1.zip --dir "$MAGLIASO_ROOT/dist"

      - name: Download
        working-directory: beamng/pipeline
        run: |
          python prepare_work.py
          python download_swisstopo.py
          python download_av.py
          python download_tlm.py
          python download_gwr.py

      - name: Rasters, buildings, trees
        working-directory: beamng/pipeline
        run: |
          python build_rasters.py
          python landcover.py
          python extract_buildings.py
          python missing_buildings.py
          python trees.py

      - name: Road network
        working-directory: beamng/pipeline
        run: |
          python network.py
          python network_surface.py

      - name: Level (build_level.py, with the finishing steps of v2.5 to v2.8)
        working-directory: beamng/pipeline
        run: |
          python build_level.py | tee "$MAGLIASO_ROOT/build_level.log"
          df -h .

      - name: Checks
        working-directory: beamng/pipeline
        run: |
          python check_level.py
          python drive_test.py

      - name: Package
        working-directory: beamng/pipeline
        run: |
          O="$GITHUB_WORKSPACE/out"
          mkdir -p "$O"
          python package.py magliaso_pura_v2.8 | tee "$O/package.log"
          md5sum "$MAGLIASO_ROOT/dist/magliaso_pura_v2.8.zip"

      - name: Same zip as the one tested
        if: inputs.tested_digest != ''
        env:
          TESTED: ${{ inputs.tested_digest }}
        run: |
          built=$(tail -n 1 out/package.log | sed -n 's/.*digest \([0-9a-f]*\).*/\1/p')
          echo "built: $built"
          echo "tested: $TESTED"
          if [ "$built" != "$TESTED" ]; then
            echo "::error::the zip built here is not the one tested in the game (digest $built, tested $TESTED)"
            exit 1
          fi

      - name: Publish
        run: |
          gh release create v2.8 "$MAGLIASO_ROOT/dist/magliaso_pura_v2.8.zip" --target "$GITHUB_SHA" \
            --title "BeamNG.drive map Malcantone v2.8" --notes-file beamng/RELEASE_v2.8.md
