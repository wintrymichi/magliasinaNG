# v3.0.40: the whole villages of Caslano and Arosio (beamng/dati/paesi_interi.json, paesi_interi.py), which the area
# had only within 100 m of the roads; the buildings of the register in the grown area added to the pinned extract
# (beamng/dati/gwr_area.json.gz, download_gwr.py --add, the others stay as pinned) and the OpenStreetMap elements over
# the villages to the pinned OSM extracts (download_osm.py --add); top and oblique views of the area
# before and after over SWISSIMAGE in beamng/verifica/paesi_interi/. swisstopo cannot be reached from the cloud
# sessions, so this runs here and commits the files back to the branch it runs on.
#
# It runs on demand (workflow_dispatch) or when this file or paesi_interi.py changes on the branch of the villages.
# run stamp: 2
name: paesi interi

on:
  workflow_dispatch:
  push:
    branches: [claude/caslano-arosio-zqrmkf]
    paths: [.github/workflows/paesi_interi.yml, beamng/pipeline/paesi_interi.py]

permissions:
  contents: write

concurrency:
  group: paesi-interi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  villages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            requests==2.33.1 matplotlib==3.11.2

      - name: swissNAMES3D
        working-directory: beamng/pipeline
        run: python download_swisstopo.py --names

      - name: Villages (paesi_interi.py)
        working-directory: beamng/pipeline
        run: |
          python paesi_interi.py
          python -c "import area; print(area.check())"

      - name: Building register over the grown area (download_gwr.py --add)
        working-directory: beamng/pipeline
        run: python download_gwr.py --add

      - name: OpenStreetMap over the villages (download_osm.py --add)
        working-directory: beamng/pipeline
        run: python download_osm.py --add

      - name: Views before and after
        working-directory: beamng/pipeline
        run: |
          rm -rf ../verifica/paesi_interi
          python paesi_interi.py --preview ../verifica/paesi_interi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beamng/dati/paesi_interi.json beamng/dati/gwr_area.json.gz beamng/dati/osm_area.json.gz \
            beamng/dati/osm_pois.json.gz beamng/verifica/paesi_interi
          git diff --cached --stat
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Whole villages: Caslano and Arosio (paesi_interi.py, download_gwr/osm --add)"
          git push origin HEAD:${{ github.ref_name }}
