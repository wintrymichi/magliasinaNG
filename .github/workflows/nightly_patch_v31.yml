# Patch the v3.1 test zip of the pre-release "nightly" without building it again (2026-10-23): the stone wing walls
# at the corners of the Via Golf underpass moved out of the asphalt (patch_underpass_walls.py; the build has it since
# 7a9530c). Started by a change of beamng/nightly/patch_v31_stamp.txt on the v3.1 integration branch.
name: nightly patch (v3.1 underpass walls)

on:
  workflow_dispatch:
  push:
    branches: [claude/tetti-fluttuanti-8q4m1p]
    paths: [beamng/nightly/patch_v31_stamp.txt]

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      ZIP_NAME: magliaso_pura_v3.1_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --progress-bar off numpy scipy shapely pyproj rasterio pillow opencv-python-headless

      - name: Download the nightly zip
        run: |
          mkdir -p "$RUNNER_TEMP/z"
          gh release download nightly --pattern "$ZIP_NAME.zip" --dir "$RUNNER_TEMP/z"
          ls -l "$RUNNER_TEMP/z"

      - name: Move the wing walls out of the road
        working-directory: beamng/pipeline
        run: |
          python patch_underpass_walls.py "$RUNNER_TEMP/z/$ZIP_NAME.zip" | tee "$RUNNER_TEMP/patch.log"
          grep -q "underpass walls: 259 vertices moved in 1 files" "$RUNNER_TEMP/patch.log"
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(z.testzip() or 'zip ok', len(z.namelist()), 'entries')" "$RUNNER_TEMP/z/$ZIP_NAME.zip"
          md5sum "$RUNNER_TEMP/z/$ZIP_NAME.zip"

      - name: Upload it again
        run: |
          gh release upload nightly "$RUNNER_TEMP/z/$ZIP_NAME.zip" --clobber
          cp beamng/nightly/v31_notes.md "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "**Patched $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA::7}\`:** the stone wing walls at the four corners of the Via Golf underpass no longer stand in the asphalt (\`$ZIP_NAME.zip\` replaced)."
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit nightly --notes-file "$RUNNER_TEMP/notes.md"
