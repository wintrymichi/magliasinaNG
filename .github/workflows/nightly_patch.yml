# Patch the zip of the pre-release "nightly" without building it again: download it, run one finishing step of the
# build on the unpacked level, put back only the files the step wrote, upload it again under the same name and add a
# line about it to the notes. v3.0.40: the far tree imposters (patch_far_imposters.py, gone). v3.1.1 (2026-10-25):
# the finishing step road_seams (ramps instead of steps between two pieces of carriageway), which a build from this
# branch runs by itself (road_seams is not idempotent: run it once on a zip). Then forest_grass (grass in the woods), then skin_grass (meadow banks).
#
# It runs when beamng/nightly/patch_stamp.txt changes on the integration branch, or on demand. Never while
# nightly_build.yml runs (that one replaces the whole pre-release at its end).
name: nightly patch

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-l0wmg8]
    paths: [beamng/nightly/patch_stamp.txt]

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      ZIP_NAME: magliaso_pura_v3.1.1_nightly
      STEP: skin_grass            # the name in build_level.FINISH; MOD.FN(level root, report=...) runs it
      MOD: steep_skin
      FN: skin_grass_step
      WHAT: no steep skin earth on the meadow banks (no pale patches), the meadow and its grass there again
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --progress-bar off numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 pyproj==3.7.2 rasterio==1.4.4 pillow==12.3.0 opencv-python-headless==5.0.0.93 scikit-image==0.26.0

      - name: Download the nightly zip
        run: |
          mkdir -p "$RUNNER_TEMP/z"
          gh release download nightly --pattern "$ZIP_NAME.zip" --dir "$RUNNER_TEMP/z"
          ls -l "$RUNNER_TEMP/z"
          md5sum "$RUNNER_TEMP/z/$ZIP_NAME.zip"

      - name: Run the step on the unpacked level, put back the files it wrote
        working-directory: beamng/pipeline
        run: |
          L="$RUNNER_TEMP/level"
          mkdir -p "$L"
          unzip -q "$RUNNER_TEMP/z/$ZIP_NAME.zip" -d "$L"
          touch "$RUNNER_TEMP/marker"
          sleep 2
          python -c "import importlib, sys; getattr(importlib.import_module(sys.argv[1]), sys.argv[2])(sys.argv[3], report=sys.argv[4])" \
            "$MOD" "$FN" "$L" "$RUNNER_TEMP/$STEP.json" | tee "$RUNNER_TEMP/patch.log"
          cat "$RUNNER_TEMP/$STEP.json"
          (cd "$L" && find . -type f -newer "$RUNNER_TEMP/marker" | sed 's|^\./||' | tee "$RUNNER_TEMP/changed.txt" | zip -q "$RUNNER_TEMP/z/$ZIP_NAME.zip" -@)
          echo "$(wc -l < "$RUNNER_TEMP/changed.txt") files put back"
          # files the step deleted leave the zip too (skin_grass removes whole skin tiles)
          python -c "import zipfile,os,sys; z=zipfile.ZipFile(sys.argv[1]); print('\n'.join(n for n in z.namelist() if not n.endswith('/') and not os.path.exists(os.path.join(sys.argv[2], n))))" \
            "$RUNNER_TEMP/z/$ZIP_NAME.zip" "$L" > "$RUNNER_TEMP/gone.txt"
          echo "$(grep -c . "$RUNNER_TEMP/gone.txt") files deleted"
          if [ -s "$RUNNER_TEMP/gone.txt" ]; then zip -q -d "$RUNNER_TEMP/z/$ZIP_NAME.zip" -@ < "$RUNNER_TEMP/gone.txt"; fi
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(z.testzip() or 'zip ok', len(z.namelist()), 'entries')" "$RUNNER_TEMP/z/$ZIP_NAME.zip"
          md5sum "$RUNNER_TEMP/z/$ZIP_NAME.zip"

      - name: Upload it again
        run: |
          gh release upload nightly "$RUNNER_TEMP/z/$ZIP_NAME.zip" --clobber
          gh release view nightly --json body -q .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "**Patched $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA::7}\`:** the finishing step \`$STEP\` run on this zip ($WHAT)."
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit nightly --notes-file "$RUNNER_TEMP/notes.md"
