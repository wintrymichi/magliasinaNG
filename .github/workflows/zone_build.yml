# Ticino a blocchi: the full pipeline build of Ticino zones (beamng/ticino/zones.py), one job per zone, each with
# MAGLIASO_ZONE set (config.py: the zone's area, terrain block and level name; without it the build is the Malcantone
# level as before). The zones are listed in beamng/ticino/zone_list.txt (one zone file name a line); a change of
# beamng/ticino/zone_stamp.txt on a push starts the run. Each zone's zip and build log go to the DRAFT release
# "ticino-zones" (not public). The cloud session cannot dispatch a workflow off the default branch (hence the stamp).
name: ticino zone build

on:
  workflow_dispatch:
  push:
    paths:
      - beamng/ticino/zone_stamp.txt

concurrency:
  group: ticino-zones-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      zones: ${{ steps.z.outputs.zones }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - id: z
        run: |
          Z=$(grep -v '^\s*#' beamng/ticino/zone_list.txt | grep -v '^\s*$' | python3 -c 'import sys, json; print(json.dumps([l.strip() for l in sys.stdin]))')
          echo "zones=$Z" >> "$GITHUB_OUTPUT"
          echo "$Z"
          gh release view ticino-zones >/dev/null 2>&1 || \
            gh release create ticino-zones --draft --target "$GITHUB_SHA" --title "Ticino zones (draft, not a release)" \
              --notes "Pipeline builds of Ticino zones (beamng/ticino/zones.py) of branch $GITHUB_REF_NAME. Not a release."

  zone:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        zone: ${{ fromJson(needs.setup.outputs.zones) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      MAGLIASO_NO_PHOTO_TEXTURES: "1"
      MAGLIASO_REFERENCE_ZIP: ${{ github.workspace }}/../bm/dist/magliaso_pura_v1.1.zip
      MAGLIASO_ZONE: ${{ github.workspace }}/beamng/ticino/zones/ti/${{ matrix.zone }}.json
      PYTHONHASHSEED: "0"
      PATCH_WORKERS: "2"
      PYTHONUNBUFFERED: "1"
      Z: ${{ matrix.zone }}
    steps:
      - name: Disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: |
          pip install --progress-bar off numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            scikit-image==0.26.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 requests==2.33.1 \
            matplotlib==3.11.2 pyogrio==0.13.0 osmium
          sudo apt-get install -y -q osmium-tool
          mkdir -p "$MAGLIASO_ROOT/logs"
          cat "$MAGLIASO_ZONE"

      - name: Downloads from earlier runs
        uses: actions/cache@v4
        with:
          path: /home/runner/work/magliasinaNG/bm/data
          key: zone-data-${{ matrix.zone }}-${{ hashFiles('beamng/pipeline/download_*.py') }}
          restore-keys: zone-data-${{ matrix.zone }}-

      - name: Release v1.1 (neutral textures)
        run: |
          mkdir -p "$MAGLIASO_ROOT/dist"
          gh release download v1.1 --pattern magliaso_pura_v1.1.zip --dir "$MAGLIASO_ROOT/dist"

      - name: Download
        working-directory: beamng/pipeline
        run: |
          {
          python prepare_work.py
          python download_swisstopo.py
          python download_worldcover.py
          python download_av.py
          python download_tlm.py
          python download_gwr.py
          python download_osm.py
          du -sh "$MAGLIASO_ROOT/data"/* || true
          } 2>&1 | tee "$MAGLIASO_ROOT/logs/1_download.log"

      - name: Rasters, buildings, trees
        working-directory: beamng/pipeline
        run: |
          {
          /usr/bin/time -v python build_rasters.py
          python landcover.py
          python extract_buildings.py
          python missing_buildings.py
          python trees.py
          } 2>&1 | tee "$MAGLIASO_ROOT/logs/2_rasters.log"

      - name: Road network
        working-directory: beamng/pipeline
        run: |
          { python network.py && python network_surface.py; } 2>&1 | tee "$MAGLIASO_ROOT/logs/3_network.log"

      - name: Level (build_level.py, every finishing step inside)
        working-directory: beamng/pipeline
        run: |
          /usr/bin/time -v python build_level.py 2>&1 | tee "$MAGLIASO_ROOT/logs/4_build_level.log"
          df -h .

      - name: Package
        working-directory: beamng/pipeline
        run: |
          python package.py "$Z" 2>&1 | tee "$MAGLIASO_ROOT/logs/5_package.log"
          ls -la "$MAGLIASO_ROOT/dist"
          gh release upload ticino-zones "$MAGLIASO_ROOT/dist/$Z.zip" --clobber

      - name: Logs (also when a step failed)
        if: always()
        run: |
          free -g; df -h . || true
          (cd "$MAGLIASO_ROOT" && zip -qr "$RUNNER_TEMP/${Z}_logs.zip" logs work/reports 2>/dev/null) || true
          gh release upload ticino-zones "$RUNNER_TEMP/${Z}_logs.zip" --clobber || true
