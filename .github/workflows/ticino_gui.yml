# Ticino Server, the Windows app (beamng/ticino/gui): one self-contained TicinoServer.exe (.NET 10, WPF, Fluent theme),
# screenshots of every page in the light and dark theme (the app's --screenshots mode, with the real release read
# through the job's token), both on the draft release "ticino-app"; on the ticino branch the app also goes on the
# release named in tools_release.txt as app_ticino.zip. The zip is not called ticino_*.zip (the installer and the
# server take every ticino_*.zip for a level pack).
name: ticino gui

on:
  workflow_dispatch:
  push:
    branches: [ticino, claude/project-thread-9w6q31]
    paths:
      - beamng/ticino/gui/**
      - .github/workflows/ticino_gui.yml

permissions:
  contents: write

concurrency:
  group: ticino-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        shell: pwsh
        run: |
          dotnet publish beamng/ticino/gui/TicinoServer.csproj -c Release -o out -p:InformationalVersion="1.0.0+$($env:GITHUB_SHA.Substring(0,7))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out | Format-Table Name, Length
      - name: Screenshots
        shell: pwsh
        run: |
          $env:TICINO_APP_DIR = Join-Path $env:RUNNER_TEMP 'appdir'
          $shots = Join-Path $PWD 'shots'
          $p = Start-Process -FilePath out/TicinoServer.exe -ArgumentList @('--screenshots', $shots) -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host 'timeout' }
          Get-ChildItem $shots | Format-Table Name, Length
          if (Test-Path "$shots/error.txt") { Get-Content "$shots/error.txt"; exit 1 }
          if (Test-Path "$env:TICINO_APP_DIR/app.log") { Get-Content "$env:TICINO_APP_DIR/app.log" }
      # A PC installed in packs mode (the PC test of 1.0.0: 90 zips in mods, hashed by the installer): a user folder
      # with every zip of the release in mods as a sparse file of its size (no disk space), the installer's
      # install.json ("mode": "packs") and checked.json, one zone left out. The app must count the zones in mods,
      # trust checked.json and offer only that zone: the log line "zones in place" says it, the pages show it.
      - name: Screenshots in packs mode
        shell: pwsh
        run: |
          $user = Join-Path $env:RUNNER_TEMP 'bng_user'
          $mods = Join-Path $user 'mods'
          New-Item -ItemType Directory -Force -Path $mods, (Join-Path $user 'ticino_tools'), (Join-Path $user 'ticino_download') | Out-Null
          $rel = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json | Where-Object tag_name -eq 'ticino-all' | Select-Object -First 1
          if (-not $rel) { Write-Host 'no ticino-all release: skipped'; exit 0 }
          $assets = @(gh api --paginate "repos/$env:GH_REPO/releases/$($rel.id)/assets?per_page=100" --jq '.[] | {name, size, digest}' | ForEach-Object { $_ | ConvertFrom-Json })
          $zips = @($assets | Where-Object { $_.name -like 'ticino_*.zip' } | Sort-Object name)
          $left = ($zips | Where-Object { $_.name -notlike 'ticino_base_*' } | Select-Object -Last 1).name
          $checked = [ordered]@{}
          foreach ($a in $zips) {
            if ($a.name -eq $left) { continue }
            $p = Join-Path $mods $a.name
            [System.IO.File]::Create($p).Close()
            fsutil sparse setflag $p | Out-Null
            if ((fsutil sparse queryflag $p) -notmatch 'is set|ist festgelegt') { throw "not sparse: $p" }
            $fs = [System.IO.File]::OpenWrite($p); $fs.SetLength([int64]$a.size); $fs.Close()
            $sha = "$($a.digest)" -replace '^sha256:', ''
            $checked[$a.name] = "$sha|$($a.size)|$((Get-Item $p).LastWriteTimeUtc.Ticks)"
          }
          $checked | ConvertTo-Json | Set-Content (Join-Path $user 'ticino_download/checked.json') -Encoding ASCII
          [ordered]@{ tag = 'ticino-all'; user = $user; mode = 'packs'; data = (Join-Path $user 'ticino_data') } |
            ConvertTo-Json | Set-Content (Join-Path $user 'ticino_tools/install.json') -Encoding ASCII
          Write-Host "$($checked.Count) sparse zips in $mods, left out: $left"
          $env:TICINO_APP_DIR = Join-Path $env:RUNNER_TEMP 'appdir_packs'
          New-Item -ItemType Directory -Force -Path $env:TICINO_APP_DIR | Out-Null
          # the release the sparse zips come from (the app's default is the public one, which may differ)
          @{ UserFolder = $user; Tag = 'ticino-all' } | ConvertTo-Json | Set-Content (Join-Path $env:TICINO_APP_DIR 'settings.json') -Encoding ASCII
          $shots = Join-Path $PWD 'shots/packs'
          $p = Start-Process -FilePath out/TicinoServer.exe -ArgumentList @('--screenshots', $shots) -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host 'timeout' }
          Get-ChildItem $shots | Format-Table Name, Length
          if (Test-Path "$shots/error.txt") { Get-Content "$shots/error.txt"; exit 1 }
          $log = Get-Content "$env:TICINO_APP_DIR/app.log"
          $log
          $line = $log | Where-Object { $_ -match 'zones in place' } | Select-Object -Last 1
          if ($line -notmatch ', 1 to download or check .*packs mode') { throw "packs mode not recognised: $line" }
      - name: Pack
        shell: bash
        run: |
          mkdir -p pack
          cp out/TicinoServer.exe pack/
          cp beamng/ticino/gui/README.txt pack/
          echo "commit ${GITHUB_SHA}" > pack/VERSION.txt
          (cd pack && 7z a -tzip ../app_ticino.zip . > /dev/null)
          (cd shots && 7z a -tzip ../app_ticino_shots.zip . > /dev/null)
          ls -l *.zip
      - name: Upload
        shell: bash
        run: |
          gh release view ticino-app > /dev/null 2>&1 || \
            gh release create ticino-app --draft --target "$GITHUB_SHA" --title "Ticino Server app (draft)" --notes "Test builds of the Windows app."
          gh release upload ticino-app app_ticino.zip app_ticino_shots.zip --clobber
          if [ "$GITHUB_REF_NAME" = "ticino" ]; then
            TAG=$(tr -d ' \r\n' < beamng/ticino/tools_release.txt)
            gh release upload "$TAG" app_ticino.zip --clobber
          fi
