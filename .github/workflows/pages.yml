name: Website

# Publishes web/ (the project website) on GitHub Pages, at https://wintrymichi.ch (web/CNAME).
# One-time setup in Settings -> Pages: Build and deployment -> Source: GitHub Actions; Custom domain:
# wintrymichi.ch, then Enforce HTTPS. A site deployed by Actions takes its domain from that setting, not
# from the CNAME file (copied anyway, so the artifact says which domain it is for). DNS: web/README.md.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site without its build scripts
        run: |
          mkdir _site
          cp -r web/index.html web/style.css web/map.svg web/CNAME web/img _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
