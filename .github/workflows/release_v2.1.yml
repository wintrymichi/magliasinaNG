# Release v2.1 della mappa BeamNG (Malcantone): come la v2.0 il livello è costruito da zero su un server GitHub
# con i dati aperti di swisstopo e della misurazione ufficiale, più:
# - la segnaletica orizzontale di tutta la rete rilevata nell'ortofoto SWISSIMAGE 10 cm del 2024
#   (risultato in beamng/dati/network_markings.json.gz, rifatto con network_markings.py);
# - sensi unici (OpenStreetMap), rotonde e carreggiate separate (swissTLM3D) per il traffico IA;
# - cartelli STOP e precedenza, panchine, cestini e lampioni di OpenStreetMap;
#   i dati OSM sono l'estratto fissato in beamng/dati/osm_area.json.gz (download_osm.py --pin per
#   aggiornarlo), così la release non cambia con OSM e non dipende dai server Overpass;
# - i binari della FLP e delle FFS (swissTLM3D);
# - la vegetazione fuori dalla sagoma libera delle strade, a terra e fuori da muri ed edifici (canopy.py).
# I controlli di check_level.py devono passare, altrimenti la release non viene creata.
# Si avvia a mano: Actions > Release v2.1 > Run workflow.
name: Release v2.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      MAGLIASO_NO_PHOTO_TEXTURES: "1"
      MAGLIASO_REFERENCE_ZIP: ${{ github.workspace }}/../bm/dist/magliaso_pura_v1.1.zip
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dipendenze
        run: |
          pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 rasterio==1.4.4 pyproj==3.7.2 \
            scikit-image==0.26.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 requests==2.33.1 \
            matplotlib==3.11.2 pyogrio==0.13.0

      - name: Release v1.1 (oggetti del percorso originale, texture neutre)
        run: |
          mkdir -p "$MAGLIASO_ROOT/dist"
          gh release download v1.1 --pattern magliaso_pura_v1.1.zip --dir "$MAGLIASO_ROOT/dist"

      - name: Download
        working-directory: beamng/pipeline
        run: |
          python prepare_work.py
          python download_swisstopo.py
          python download_av.py
          python download_tlm.py

      - name: Raster, edifici, alberi
        working-directory: beamng/pipeline
        run: |
          python build_rasters.py
          python landcover.py
          python extract_buildings.py
          python trees.py

      - name: Rete stradale
        working-directory: beamng/pipeline
        run: |
          python network.py
          python network_surface.py

      - name: Livello
        working-directory: beamng/pipeline
        run: python build_level.py

      - name: Controlli
        working-directory: beamng/pipeline
        run: python check_level.py

      - name: Pacchetto
        working-directory: beamng/pipeline
        run: |
          python package.py magliaso_pura_v2.1
          ls -la "$MAGLIASO_ROOT/dist"

      - name: Release
        run: |
          gh release create v2.1 "$MAGLIASO_ROOT/dist/magliaso_pura_v2.1.zip" --target "$GITHUB_SHA" \
            --title "Mappa BeamNG.drive Malcantone v2.1" --notes-file beamng/RELEASE_v2.1.md
