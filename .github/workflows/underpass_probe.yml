# The roads and railways of swissTLM3D (TLM_STRASSE, TLM_EISENBAHN) for the check of the underpasses in the cloud
# container, which cannot reach data.geo.admin.ch: downloaded here and printed into the log (gzip + base64), read with
# get_job_logs. Nothing is committed. Thread "Sottopassaggio di Caslano" (v3.0.40 patch). probe stamp: 2
name: underpass probe (TLM)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-2518uf]
    paths: [.github/workflows/underpass_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 pyproj==3.7.2 requests==2.33.1
      - name: TLM_STRASSE and TLM_EISENBAHN
        working-directory: beamng/pipeline
        run: |
          python -c "
          import download_tlm as d
          d.LAYERS = {k: v for k, v in d.LAYERS.items() if k in ('TLM_STRASSE', 'TLM_EISENBAHN')}
          d.main()"
          python -c "
          import base64, gzip, json, os
          import numpy as np, shapely
          from config import DATA, lv95_to_local
          import area
          keep = area.polygon().buffer(30)
          F = {L: json.load(open(os.path.join(DATA, 'tlm', L + '.json')))['features'] for L in ('TLM_STRASSE', 'TLM_EISENBAHN')}
          def geom(f):
              ps = [np.array(p)[:, :2] for p in f['parts'] if len(p) > 1]
              return shapely.MultiLineString([np.column_stack(lv95_to_local(p[:, 0], p[:, 1])) for p in ps]) if ps else None
          for L in F:
              for f in F[L]:
                  f['g'] = geom(f)
          from collections import Counter
          for L in F:
              print(L, Counter(f['props'].get('KUNSTBAUTE') for f in F[L] if f['g'] is not None and f['g'].intersects(keep)))
          under = [f for f in F['TLM_STRASSE'] if f['g'] is not None and f['g'].intersects(keep)
                   and f['props'].get('KUNSTBAUTE') not in (None, 'Keine', 'Bruecke', 'Steg', 'Bruecke mit Treppe')]
          zone = shapely.union_all([f['g'].buffer(120) for f in under])
          sub = {L: [{'props': f['props'], 'parts': f['parts']} for f in F[L] if f['g'] is not None and f['g'].intersects(zone)] for L in F}
          for f in under:
              c = f['g'].centroid
              print('UNDER', f['props'].get('KUNSTBAUTE'), f['props'].get('OBJEKTART'), f['props'].get('STRNAME'),
                    round(c.x), round(c.y), round(f['g'].length, 1))
          b = base64.b64encode(gzip.compress(json.dumps(sub).encode(), 9)).decode()
          print('SUB_BEGIN', len(b))
          for i in range(0, len(b), 4000):
              print('L' + b[i:i + 4000])
          print('SUB_END')"
