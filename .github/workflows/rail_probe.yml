# The railway lines of swissTLM3D (TLM_EISENBAHN) for the check of railway.py in the cloud container, which cannot
# reach data.geo.admin.ch: downloaded here and printed into the log (gzip + base64), read with get_job_logs.
# Nothing is committed. Thread "Binari che entrano nel muro" (v3.1). probe stamp: 1
name: rail probe (TLM_EISENBAHN)

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ih8m5k]
    paths: [.github/workflows/rail_probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install numpy==2.4.6 scipy==1.17.1 shapely==2.1.2 pyproj==3.7.2 requests==2.33.1
      - name: TLM_EISENBAHN
        working-directory: beamng/pipeline
        run: |
          python -c "
          import download_tlm as d
          d.LAYERS = {k: v for k, v in d.LAYERS.items() if k == 'TLM_EISENBAHN'}
          d.main()"
          python -c "
          import base64, gzip, os
          from config import DATA
          b = base64.b64encode(gzip.compress(open(os.path.join(DATA, 'tlm', 'TLM_EISENBAHN.json'), 'rb').read(), 9)).decode()
          print('TLM_BEGIN')
          for i in range(0, len(b), 4000):
              print('L' + b[i:i + 4000])
          print('TLM_END')"
