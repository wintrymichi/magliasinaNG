# Switzerland Builder: a whole build of a test area through the launcher (start-switzerland-builder.sh cli), as a user's
# PC runs it: micromamba and the Python environment, the downloads and the stages (first job), then the finishing steps,
# the recentring and the zip (second job: GitHub stops a job after 6 h). The area is beamng/builder/test/area.json.
# A change of beamng/builder/test/stamp.txt on a push of switzerland-builder starts it (the cloud session cannot
# dispatch a workflow off the default branch). The zip and the logs go to the DRAFT release "builder-test" (not public).
#
# "[builder finish <run id>]" in the commit message: only the second job, on the first job's build of that run (its
# artifact is kept 3 days), with the pipeline code of this commit (cli resume --update-code): a fix of a finishing step
# (tunnels...) needs no new downloads and stages. "[builder windows]" runs the Windows job too (with a finish run, or
# alone otherwise: then no Linux job). "[builder area <name>]" builds beamng/builder/test/<name>.json instead of
# area.json (no Windows job unless asked); its logs are test_<name>_part*.
name: builder test build

on:
  workflow_dispatch:
  push:
    branches: [switzerland-builder]
    paths: [beamng/builder/test/stamp.txt]

concurrency:
  # a run of another test area has a group of its own (two areas can be built at once)
  group: builder-test-${{ contains(github.event.head_commit.message, '[builder finish ') && 'finish' || (contains(github.event.head_commit.message, '[builder area ') && github.sha || 'all') }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  SWISSBUILDER_RUNTIME: /mnt/sb/runtime
  SWISSBUILDER_INSTALL: "0"
  DATA: /mnt/sb/data
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      from_run: ${{ steps.s.outputs.from_run }}
      windows: ${{ steps.s.outputs.windows }}
      area: ${{ steps.s.outputs.area }}
    steps:
      - id: s
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          F=$(printf '%s' "$MSG" | grep -oE '\[builder finish [0-9]+\]' | grep -oE '[0-9]+' | head -1 || true)
          echo "from_run=$F" >> "$GITHUB_OUTPUT"
          case "$MSG" in *"[builder windows]"*) echo "windows=true" >> "$GITHUB_OUTPUT"; echo "the Windows job too";; esac
          A=$(printf '%s' "$MSG" | grep -oE '\[builder area [a-z0-9_]+\]' | head -1 | sed -E 's/\[builder area ([a-z0-9_]+)\]/\1/' || true)
          echo "area=${A:-area}" >> "$GITHUB_OUTPUT"; echo "test area: ${A:-area}"
          echo "finishing steps only, on the build of run: ${F:-no}"
          gh release view builder-test >/dev/null 2>&1 || \
            gh release create builder-test --draft --target "$GITHUB_SHA" --title "Switzerland Builder test (draft, not a release)" \
              --notes "Test builds of the Switzerland Builder (branch switzerland-builder). Not a release."

  stages:
    needs: setup
    if: needs.setup.outputs.from_run == '' && needs.setup.outputs.windows != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Disk space and swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          # 16 GB of RAM: a dense zone's unpaved step went past it and the runner was shut down (CLAUDE.md, ti_0_6)
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/sb && sudo chown "$USER" /mnt/sb
          free -g; df -h / /mnt

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # the OpenStreetMap extract of Switzerland (and its municipal boundaries) and the drawn textures (texcache.py)
      # kept between test builds, as the app keeps them on a PC (cache.py): a new key every week, so the first build
      # of a week downloads and draws them.
      # "[builder nocache]" in the commit message builds without it (the time of a first build on a new PC)
      - uses: actions/cache@v4
        if: ${{ !contains(github.event.head_commit.message, '[builder nocache]') }}
        with:
          path: |
            /mnt/sb/data/cache/osm
            /mnt/sb/data/cache/textures
          key: builder-osm-${{ steps.week.outputs.week }}

      - name: Build, first part (launcher, downloads, stages)
        run: |
          A=beamng/builder/test/${{ needs.setup.outputs.area }}.json
          NAME=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1]))['name'])" "$A")
          BBOX=$(python3 -c "import json, sys; print(','.join(map(str, json.load(open(sys.argv[1]))['bbox'])))" "$A")
          ( while sleep 120; do echo "[mem] $(free -m | awk '/Mem/{printf "ram %d MB ", $3} /Swap/{printf "swap %d MB", $3}') disk $(df -h /mnt | awk 'NR==2{print $4}') free"; done ) &
          MEM=$!; trap 'kill $MEM 2>/dev/null || true' EXIT
          ./start-switzerland-builder.sh cli build "$NAME" "$BBOX" --data "$DATA" --until stages
          ls "$DATA/builds"

      - name: Hand the build over to the second job
        run: |
          ID=$(ls "$DATA/builds" | head -1)
          echo "$ID" > "$DATA/builds/ID"
          tar -C "$DATA/builds" -cf - --exclude='*.osm.pbf' ID "$ID" | zstd -T0 -3 > "$RUNNER_TEMP/build.tar.zst"
          ls -la "$RUNNER_TEMP/build.tar.zst"; df -h /mnt

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 3

      - name: Logs (also when a step failed)
        if: always()
        run: |
          free -g; df -h /mnt || true
          T=test_build_part1
          if [ "${{ needs.setup.outputs.area }}" != "area" ]; then T="test_${{ needs.setup.outputs.area }}_part1"; fi
          for d in "$DATA"/builds/*/; do
            cp "$d/build.log" "$RUNNER_TEMP/$T.log" && cp "$d/build.json" "$RUNNER_TEMP/$T.json" || true
          done
          gh release upload builder-test "$RUNNER_TEMP/$T".* --clobber || true

  windows:
    # the launcher as a double-click on Windows runs it (Windows PowerShell 5.1, micromamba win-64) and the whole
    # pipeline on Windows (no fork: every pool starts its workers by spawn) on a small area of Sisikon
    needs: setup
    if: needs.setup.outputs.windows == 'true' || (needs.setup.outputs.from_run == '' && needs.setup.outputs.area == 'area')
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      SWISSBUILDER_RUNTIME: D:\sb\runtime
      SWISSBUILDER_NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Launcher and the whole build of a small area (Windows)
        shell: cmd
        run: |
          call "Start Switzerland Builder.bat" cli build "Sisikon Windows" "46.945,8.614,46.953,8.627" --data D:\sb\data
      - name: The level and the log to the draft release
        if: always()
        shell: bash
        run: |
          for d in /d/sb/data/builds/*/; do
            cp "$d/build.log" "$RUNNER_TEMP/test_build_windows.log" || true
            for z in "$d"root/dist/*.zip; do [ -f "$z" ] && cp "$z" "$RUNNER_TEMP/windows_$(basename "$z")"; done
          done
          ls -la "$RUNNER_TEMP"
          gh release upload builder-test "$RUNNER_TEMP"/test_build_windows.log "$RUNNER_TEMP"/windows_*.zip --clobber || true

  finish:
    needs: [setup, stages]
    if: always() && needs.setup.result == 'success' && (needs.stages.result == 'success' || needs.setup.outputs.from_run != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Disk space and swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/sb && sudo chown "$USER" /mnt/sb
          free -g; df -h / /mnt

      - uses: actions/checkout@v4

      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # the textures the finishing steps draw (the skin's), kept between test builds as in the first job
      - uses: actions/cache@v4
        if: ${{ !contains(github.event.head_commit.message, '[builder nocache]') }}
        with:
          path: /mnt/sb/data/cache/textures
          key: builder-tex-finish-${{ steps.week.outputs.week }}

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{ runner.temp }}
          run-id: ${{ needs.setup.outputs.from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Build, second part (finishing steps, recentring, zip)
        run: |
          mkdir -p "$DATA/builds"
          zstd -dc "$RUNNER_TEMP/build.tar.zst" | tar -C "$DATA/builds" -xf -
          rm "$RUNNER_TEMP/build.tar.zst"
          ID=$(cat "$DATA/builds/ID"); rm "$DATA/builds/ID"
          UPDATE=""; [ -n "${{ needs.setup.outputs.from_run }}" ] && UPDATE="--update-code"
          ( while sleep 120; do echo "[mem] $(free -m | awk '/Mem/{printf "ram %d MB ", $3} /Swap/{printf "swap %d MB", $3}') disk $(df -h /mnt | awk 'NR==2{print $4}') free"; done ) &
          MEM=$!; trap 'kill $MEM 2>/dev/null || true' EXIT
          ./start-switzerland-builder.sh cli resume "$ID" --data "$DATA" $UPDATE
          ls -la "$DATA/builds/$ID/root/dist"

      - name: The level to the draft release
        run: |
          for z in "$DATA"/builds/*/root/dist/*.zip; do gh release upload builder-test "$z" --clobber; done

      - name: Logs (also when a step failed)
        if: always()
        run: |
          free -g; df -h /mnt || true
          T=test_build_part2
          if [ "${{ needs.setup.outputs.area }}" != "area" ]; then T="test_${{ needs.setup.outputs.area }}_part2"; fi
          for d in "$DATA"/builds/*/; do
            cp "$d/build.log" "$RUNNER_TEMP/$T.log" && cp "$d/build.json" "$RUNNER_TEMP/$T.json" || true
            (cd "$d/root" && zip -qr "$RUNNER_TEMP/${T%_part2}_reports.zip" work/reports logs 2>/dev/null) || true
          done
          gh release upload builder-test "$RUNNER_TEMP/$T".* "$RUNNER_TEMP/${T%_part2}_reports.zip" --clobber || true
