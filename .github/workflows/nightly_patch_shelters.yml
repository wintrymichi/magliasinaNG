# Fifth patch of the v3.1 test zip of the pre-release "nightly" (2026-10-23), on the zip that already has the sidewalks,
# roundabouts, stop paint and island posts: the bus shelters placed again by bus_shelters.py (FINISH step "bus_shelters"),
# which now squares each shelter to the road where it stands, keeps it off the carriageway's asphalt (6 of 36 stood on
# it), off side roads, yards far from the pole and parked cars' spots, and tries 10 m on either side of the pole too. Started by hand, or by a change of
# beamng/nightly/patch_shelters_stamp.txt: the zip is replaced only when that file's first word is "upload" (or the
# input upload is true), else only tested.
name: nightly patch (v3.1 bus shelters)
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "replace the zip on the nightly pre-release (true) or only test the patch (false)"
        default: "false"
  push:
    branches: [claude/project-thread-bpnv3b, claude/tetti-fluttuanti-8q4m1p]
    paths: [beamng/nightly/patch_shelters_stamp.txt]

concurrency:
  group: nightly-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAGLIASO_ROOT: ${{ github.workspace }}/../bm
      MAGLIASO_DATASET: ${{ github.workspace }}
      MAGLIASO_BEAMNG_USER: ${{ github.workspace }}/../bm/beamng_user
      MAGLIASO_BEAMNG_GAME: /nonexistent
      ZIP_NAME: magliaso_pura_v3.1_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies
        run: pip install --progress-bar off numpy scipy shapely pyproj rasterio pillow opencv-python-headless

      - name: Download and extract the nightly zip
        run: |
          df -h "$RUNNER_TEMP" | tail -1
          mkdir -p "$RUNNER_TEMP/z" "$RUNNER_TEMP/lvl"
          gh release download nightly --pattern "$ZIP_NAME.zip" --dir "$RUNNER_TEMP/z"
          md5sum "$RUNNER_TEMP/z/$ZIP_NAME.zip"
          # the entries and how each was stored, to write the zip again the same way
          python -c "import zipfile,json,sys; z=zipfile.ZipFile(sys.argv[1]); json.dump([(i.filename,i.compress_type) for i in z.infolist()], open(sys.argv[2],'w'))" \
            "$RUNNER_TEMP/z/$ZIP_NAME.zip" "$RUNNER_TEMP/entries.json"
          unzip -q "$RUNNER_TEMP/z/$ZIP_NAME.zip" -d "$RUNNER_TEMP/lvl"
          rm "$RUNNER_TEMP/z/$ZIP_NAME.zip"
          df -h "$RUNNER_TEMP" | tail -1

      - name: Bus shelters
        working-directory: beamng/pipeline
        env:
          MAGLIASO_OSM_PINNED: "1"
        run: |
          python - "$RUNNER_TEMP/lvl" "$RUNNER_TEMP/shelters.json" <<'PY'
          import json, sys
          import bus_shelters
          r = bus_shelters.bus_shelters_step(sys.argv[1], sys.argv[2])
          # measured on the v3.1 test zip in the cloud session: 39 (36 before, 6 of them on the asphalt)
          assert r["stops"] == 212, r
          assert 30 <= r["shelters"] <= 50, r
          print("bus shelters ok", r)
          PY

      - name: Write the zip again
        run: |
          python - "$RUNNER_TEMP/lvl" "$RUNNER_TEMP/entries.json" "$RUNNER_TEMP/z/$ZIP_NAME.zip" <<'PY'
          import json, os, sys, zipfile
          root, entries, out = sys.argv[1:]
          how = dict(json.load(open(entries)))
          names = []
          for dp, _, fs in os.walk(root):
              for f in fs:
                  names.append(os.path.relpath(os.path.join(dp, f), root).replace(os.sep, "/"))
          order = {n: i for i, (n, _) in enumerate(json.load(open(entries)))}
          names.sort(key=lambda n: (order.get(n, 10 ** 9), n))
          with zipfile.ZipFile(out, "w", allowZip64=True) as z:
              for n in names:
                  z.write(os.path.join(root, *n.split("/")), n, compress_type=how.get(n, zipfile.ZIP_DEFLATED))
          print(len(names), "entries,", len(set(names) - set(how)), "new,", len(set(how) - set(names) - {n for n in how if n.endswith("/")}), "gone")
          PY
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print(z.testzip() or 'zip ok', len(z.namelist()), 'entries')" "$RUNNER_TEMP/z/$ZIP_NAME.zip"
          ls -l "$RUNNER_TEMP/z"; md5sum "$RUNNER_TEMP/z/$ZIP_NAME.zip"

      - name: Upload it again
        run: |
          if [ "${{ github.event.inputs.upload }}" != "true" ] && [ "$(awk 'NR==1{print $1}' beamng/nightly/patch_shelters_stamp.txt)" != "upload" ]; then
            echo "test only: the nightly zip is not replaced"; exit 0
          fi
          gh release upload nightly "$RUNNER_TEMP/z/$ZIP_NAME.zip" --clobber
          gh release view nightly --json body -q .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "**Patched $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA::7}\`:** the bus shelters placed again: none on the asphalt of the carriageway any more (6 stood on it), squared to the road, beside their stop (\`$ZIP_NAME.zip\` replaced)."
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit nightly --notes-file "$RUNNER_TEMP/notes.md"
